name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Require npm 11.5.1 or newer for trusted publishing
        run: |
          node -e "const [a,b,c]=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" || npm install -g npm@latest
          npm --version
      - name: Check that the tag matches the package version
        id: version
        run: |
          node -e "const v=require('./package.json').version;if(process.env.GITHUB_REF_NAME!=='v'+v){console.error('Tag '+process.env.GITHUB_REF_NAME+' does not match package version '+v);process.exit(1)}"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish to npm (directory publish, OIDC trusted publishing, automatic provenance)
        run: npm publish
  release:
    # Separate job so a failed release step can be rerun without republishing.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Download the published tarball from the registry
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          mkdir release && cd release
          # Registry propagation can take a few minutes after publish.
          for attempt in $(seq 1 24); do
            if npm pack "@woody_s/htmledit@${VERSION}" --ignore-scripts; then break; fi
            if [ "$attempt" = 24 ]; then echo "Version ${VERSION} not visible after 6 minutes"; exit 1; fi
            sleep 15
          done
          sha256sum *.tgz > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "HTMLEdit ${VERSION}" --generate-notes --verify-tag
